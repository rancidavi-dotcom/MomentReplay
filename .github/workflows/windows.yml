name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qtkeychain
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-ffmpeg
      - name: Configure
        run: cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DMOMENT_FRIENDS_API_URL=https://moment-friends-api.rancidavi.workers.dev
      - name: Build
        run: cmake --build build-windows --parallel 4
      - name: Test shared features and native global keys
        env:
          MOMENT_UI_PREVIEW_DIR: ${{ github.workspace }}/artifacts/windows-ui
        run: |
          mkdir -p artifacts/windows-ui
          ctest --test-dir build-windows --output-on-failure --timeout 90 -E windows-capture-test
      - name: Test real desktop capture on disposable runner
        env:
          MOMENT_TEST_DESKTOP_CAPTURE: '1'
        run: ctest --test-dir build-windows --output-on-failure --timeout 90 -R windows-capture-test
      - name: Package portable app
        env:
          MOMENT_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash packaging/windows/package.sh build-windows
      - name: Start packaged app without MSYS2 on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QML_IMPORT_PATH -ErrorAction SilentlyContinue
          $exe = Join-Path $PWD 'dist/Moment/Moment.exe'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $stderr = Join-Path $PWD 'artifacts/packaged-stderr.log'
          $stdout = Join-Path $PWD 'artifacts/packaged-stdout.log'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -RedirectStandardError $stderr -RedirectStandardOutput $stdout
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged Moment did not finish its startup check.'
          }
          Get-Content $stderr, $stdout
          if ($process.ExitCode -ne 0) { throw "Packaged Moment failed: $($process.ExitCode)" }
      - name: Build single-file Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'Inno Setup compiler was not found after installation.' }
          $projectLine = Select-String -Path CMakeLists.txt -Pattern '^project\(medal_linux VERSION ' | Select-Object -First 1
          $version = [regex]::Match($projectLine.Line, 'VERSION ([0-9.]+)').Groups[1].Value
          & $iscc "/DSourceDir=$PWD\dist\Moment" "/DOutputDir=$PWD\dist" "/DAppVersion=$version" "$PWD\packaging\windows\Moment.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path dist/Moment-Setup-x64.exe)) { throw 'Installer output is missing.' }
          & $iscc "$PWD\packaging\windows\Moment-Uninstall.iss"
          if ($LASTEXITCODE -ne 0) { throw "Moment uninstaller build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path dist/Moment-Uninstall-x64.exe)) { throw 'Standalone uninstaller output is missing.' }
      - name: Upload single Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Moment-Windows-x64-installer
          path: |
            dist/Moment-Setup-x64.exe
            dist/Moment-Uninstall-x64.exe
          if-no-files-found: error
      - name: Upload package diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-diagnostics
          path: dist/Moment/
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            artifacts/windows-ui/
            artifacts/packaged-*.log
            build-windows/Testing/Temporary/LastTest.log
            build-windows/Testing/Temporary/LastTestsFailed.log
