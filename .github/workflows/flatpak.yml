name: Flatpak

on:
  push:
    branches: [main, windows-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
      - name: Add Flathub and build dependencies
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --yes flathub org.kde.Platform//6.11 org.kde.Sdk//6.11
      - name: Build Flatpak
        run: flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build io.moment.Moment.yml
      - name: Create installable Flatpak bundle
        run: flatpak build-bundle flatpak-repo Moment-x86_64.flatpak io.github.rancidavi_dotcom.moment
      - uses: actions/upload-artifact@v4
        with:
          name: Moment-Flatpak-x86_64
          path: Moment-x86_64.flatpak
          if-no-files-found: error
